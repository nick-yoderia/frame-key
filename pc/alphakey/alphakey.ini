# 0 = pass everything through (apps see no ALPHA_BLEND), 1 = on.
enabled = 1
# Which headset to follow: auto (the one streaming to this PC) or a headset id
# (the Frame Key app on the PC sets this).
headset = auto
# Key colour and ramp until a headset answers on the network.
key = ff00ff
# The Frame keyer's threshold and threshold + softness (CbCr distance). Partly
# transparent pixels are written between these; opaque content is kept at
# least `guard` away from the key (default: ramp end + 0.03).
ramp = 0.12 0.20
